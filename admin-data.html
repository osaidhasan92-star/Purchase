<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Import / Export Records</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"><link rel="stylesheet" href="shared.css"><link rel="stylesheet" href="styles.css"></head><body><template id="admin-content"><div class="section-card"><div class="section-head"><div class="section-title">Import and export company records</div></div>
<p class="module-note">Import is available only on an empty installation. Use the same browser and origin as your previous demo, or select a JSON file exported using the README instructions.</p>
<div class="module-data-actions"><button class="btn-secondary" id="browser-import">Import this browser's demo records</button><button class="btn-secondary" id="export">Export operational records</button></div>
<div class="module-data-file"><label for="import-file">Select an exported JSON file</label><input id="import-file" type="file" accept="application/json,.json"><button class="btn-primary" id="file-import">Import selected file</button></div>
<div class="detail-note"><b>Account and backup information</b><p>Imported accounts remain disabled until an administrator resets their passwords and activates them. Browser passwords are never imported. This JSON export covers operational registers; use a database backup for full accounting, inventory, manufacturing, expense and audit recovery.</p></div>
<pre id="result" role="status" class="module-data-result"></pre></div></template><script src="backend-client.js"></script><script src="app.js"></script><script>
window.addEventListener('DOMContentLoaded',async()=>{
 await initAppState();if(!APP_STATE)return;
 const content=document.getElementById('admin-content').innerHTML;
 if(currentUser().role!=='Admin'){layout('admin','Import / Export Records','Administrator access required','<div class="section-card">Administrator access is required to import or export records.</div>');return}
 layout('admin','Import / Export Records','Company records and migration',content);
const result=document.getElementById('result');
function display(error){result.textContent=error.message||String(error)}
function stripCredentials(value){if(Array.isArray(value))return value.map(stripCredentials);if(value&&typeof value==='object')return Object.fromEntries(Object.entries(value).filter(([k])=>!['password','password_hash','initialPassword','currentPassword','newPassword'].includes(k)).map(([k,v])=>[k,stripCredentials(v)]));return value}
async function load(){const me=await BackendPersistence.request('/auth/me');if(me.user.role!=='Admin')throw new Error('Administrator access required')}
async function importData(data){await load();result.textContent='Importing…';const response=await BackendPersistence.request('/admin/import',{method:'POST',body:JSON.stringify(stripCredentials(data))});result.textContent=response.message}
document.getElementById('browser-import').onclick=async()=>{try{const app=JSON.parse(localStorage.getItem('purchase_demo_state_v1')||'null'),hr=JSON.parse(localStorage.getItem('unified_hr_payroll_v1')||'{}');if(!app)throw new Error('No demo records found in this browser. Select an exported file instead.');await importData({app,hr})}catch(e){display(e)}};
document.getElementById('file-import').onclick=async()=>{try{const file=document.getElementById('import-file').files[0];if(!file)throw new Error('Select a JSON file');await importData(JSON.parse(await file.text()))}catch(e){display(e)}};
document.getElementById('export').onclick=async()=>{try{await load();const data=await BackendPersistence.request('/admin/export');const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='purchase-records-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);result.textContent='Records exported.'}catch(e){display(e)}};


});
</script></body></html>
