services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: purchase
      POSTGRES_USER: purchase
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - purchase_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U purchase -d purchase"]
      interval: 5s
      timeout: 5s
      retries: 12
  web:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://purchase:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/purchase
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in .env}
      COOKIE_SECURE: "true"
      ERP_LOCK_TIMEOUT_MS: ${ERP_LOCK_TIMEOUT_MS:-5000}
    depends_on:
      db:
        condition: service_healthy
volumes:
  purchase_db:
