<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dexterra — Purchase Management</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"><link rel="stylesheet" href="shared.css"><style>body{font-family:Inter,Arial,sans-serif;background:#F0F2F8}.login{min-height:100vh;display:flex}.brand{display:none}@media(min-width:1024px){.brand{display:flex;width:42%;align-items:center;justify-content:center;background:linear-gradient(160deg,#FAFBFF,#F0F2F8);border-right:1px solid #E5E7EB}}.brand-card{background:#fff;border-radius:24px;padding:48px;box-shadow:0 20px 60px -12px rgba(27,42,107,.15)}.brand-card img{width:300px}.form{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}.box{width:100%;max-width:390px}.field{margin-bottom:16px}.field label{display:block;font-size:12px;font-weight:700;color:#6B7280;text-transform:uppercase;margin-bottom:7px}.field input{width:100%;padding:12px 14px;border:1px solid #E5E7EB;border-radius:10px;background:#fff}.btn{width:100%;border:0;background:#1B2A6B;color:#fff;padding:12px;border-radius:10px;font-weight:700;cursor:pointer}.demo{margin-top:20px;background:#fff;border:1px solid #E5E7EB;border-radius:12px;padding:14px;font-size:12px;color:#6B7280}.toast{position:fixed;bottom:24px;right:24px;background:#1F2937;color:#fff;padding:11px 18px;border-radius:10px;z-index:99}</style></head><body><div class="login"><section class="brand"><div><div class="brand-card"><img src="assets/logo.png"></div><div style="text-align:center;margin-top:30px;color:#6B7A99;font-size:11px;font-weight:700;letter-spacing:1.5px">PURCHASE MANAGEMENT SYSTEM</div></div></section><section class="form"><div class="box"><div style="display:block;text-align:center;margin-bottom:28px"><img src="assets/logo.png" style="width:220px;max-width:75%"></div><h2 style="font-size:24px;margin:0 0 5px">Welcome back</h2><p style="color:#9CA3AF;font-size:14px;margin:0 0 26px">Sign in to your procurement workspace</p><div class="field"><label>Email address</label><input id="email" type="email" value="admin@purchase.local"></div><div class="field"><label>Password</label><input id="password" type="password" value="admin123" onkeydown="if(event.key==='Enter')login()"></div><button class="btn" onclick="login()">Sign in</button><div class="demo"><b>Demo account</b><br>admin@purchase.local / admin123<br><span>Standalone test mode — no previous CRM database.</span></div></div></section></div><div id="toast"></div><script>function login(){const e=document.getElementById('email').value.trim(),p=document.getElementById('password').value;const raw=localStorage.getItem('purchase_demo_v1');let users=[];try{users=raw?(JSON.parse(raw).users||[]):[]}catch(_){users=[]}if(!users.length&&e==='admin@purchase.local'&&p==='admin123')users=[{name:'Admin User',role:'Admin',email:e,password:p,active:true}];const u=users.find(a=>a.email.toLowerCase()===e.toLowerCase()&&a.password===p&&a.active!==false);if(u){sessionStorage.setItem('purchase_user',JSON.stringify({id:u.id||null,name:u.name,role:u.role,email:u.email}));location.href='dashboard.html'}else{document.getElementById('toast').textContent='Invalid credentials or inactive user';document.getElementById('toast').className='toast';}}if(sessionStorage.getItem('purchase_user'))location.href='dashboard.html';</script></body></html>
