name: Backend and frontend checks
on: [push, pull_request]
jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r backend/requirements.txt pytest
      - run: python -m pytest backend -q
      - run: for file in app.js backend-client.js crm.js sales.js sales_patch.js hr.js; do node --check "$file"; done
      - run: npm ci
      - run: npm run test:dom
